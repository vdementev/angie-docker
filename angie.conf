# Angie's packaged angie.conf with this image's latency tuning applied.
# Everything here is http-level or main-level: no vhost of our own, so your
# /etc/angie/http.d/*.conf stays the source of truth. Mount over this file
# to replace the tuning wholesale.

user  angie;
worker_processes  auto;
worker_rlimit_nofile  65536;

# `auto` counts host CPUs, not the container's cgroup quota. Under
# `cpus: 2` that spawns a worker per host core and they fight over two
# cores' worth of runtime — set an explicit number when you cap CPU.

# Bound how long a reload keeps old workers (and their connections and
# memory) alive; without it a single hung upstream pins them forever.
worker_shutdown_timeout  30s;

# JIT-compile location/map/rewrite regexes once at startup instead of
# interpreting them on every request.
pcre_jit  on;

error_log  /var/log/angie/error.log  notice;
pid        /run/angie.pid;

events {
    worker_connections  65536;

    # No accept mutex: every worker takes connections the moment the kernel
    # wakes it, which is what keeps accept latency flat across cores.
    accept_mutex  off;
}


http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    types_hash_max_size  2048;

    # Don't advertise the version in responses or error pages.
    server_tokens  off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format extended '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" rt="$request_time" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'h="$host" sn="$server_name" ru="$request_uri" u="$uri" '
                        'ucs="$upstream_cache_status" ua="$upstream_addr" us="$upstream_status" '
                        'uct="$upstream_connect_time" urt="$upstream_response_time"';

    # Buffered: one write() per 32k of log instead of one per request, and
    # flushed at least every 5s so `docker logs` stays close to live.
    access_log  /var/log/angie/access.log  main  buffer=32k flush=5s;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Read files (including proxy_cache hits) on a thread pool so a cold
    # page cache blocks one thread instead of the whole worker.
    aio  threads;

    keepalive_timeout   65s;
    keepalive_requests  1000;

    # Slowloris budget. send_timeout is the gap between two successive
    # writes to a client, not the total time a response may take.
    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           30s;

    reset_timedout_connection  on;

    # Serve a static file without a stat()/open() per request. Negative
    # lookups stay uncached (open_file_cache_errors off, the default) so a
    # file that appears mid-deploy is visible immediately.
    open_file_cache           max=10000 inactive=60s;
    open_file_cache_valid     30s;
    open_file_cache_min_uses  2;

    # HTTP/1.1 plus an empty Connection header is what lets `keepalive N;`
    # in an upstream block actually reuse sockets, so a proxied request
    # skips the TCP (and TLS) handshake.
    #
    # Careful: proxy_set_header is inherited only when the inner level sets
    # none of its own. A server/location that sets e.g. `proxy_set_header
    # Host $host;` drops this one too and has to repeat it.
    proxy_http_version  1.1;
    proxy_set_header    Connection  "";

    # Fail fast on an upstream that isn't accepting, instead of holding the
    # client for the 60s default.
    proxy_connect_timeout  5s;

    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_min_length  256;
    # 5 is the knee of the curve: ~the ratio of 9 for a fraction of the CPU.
    gzip_comp_level  5;
    gzip_types       text/plain text/css text/xml text/javascript
                     application/javascript application/json application/xml
                     application/xml+rss application/rss+xml
                     application/atom+xml application/vnd.api+json
                     image/svg+xml font/ttf font/otf;

    # TLS 1.3 finishes the handshake in one round trip and the shared cache
    # resumes the rest. Tickets stay off: they buy resumption across nodes
    # this image doesn't have, at the cost of forward secrecy.
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_ecdh_curve             X25519:prime256v1;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # AES-GCM first for anything with AES-NI, ChaCha20 behind it for phones.
    ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Smaller TLS records: the first byte of a response reaches the client
    # without waiting for 16k to fill. Costs a little peak throughput.
    ssl_buffer_size  4k;

    include /etc/angie/http.d/*.conf;
}

