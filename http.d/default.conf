# Catch-all for requests whose Host matches none of your vhosts: close the
# connection without a response. Replaces Angie's stock welcome page, which
# answered any Host (scanners hitting the bare IP included) and advertised
# what the proxy runs. Port 80 only. No `default_server`, so a vhost of yours
# that sets it still wins; without one, the first server for :80 in sorted
# file order is the default. Mount over this file, or drop it, to change that.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    access_log  off;
    return      444;
}
