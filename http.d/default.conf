# Catch-all for requests whose Host matches none of your vhosts: close the
# connection without a response. Replaces Angie's stock welcome page, which
# answered any Host (scanners hitting the bare IP included) and advertised
# what the proxy runs. No `default_server`, so a vhost of yours that sets it
# still wins; without one, this file sorts first and catches the rest.
# Mount over it, or drop it from http.d, to change that.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    access_log  off;
    return      444;
}
