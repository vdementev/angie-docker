name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "10 3 * * 1" # weekly rebuild: fresh base layers + package updates

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: vdementev/docker-workflows/.github/workflows/build-image.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      image: angie
      push: ${{ github.event_name != 'pull_request' }}
      tags: |
        type=raw,value=latest
      # Smoke-tests the locally built amd64 image before it can be published:
      # module loading + brotli/zstd/cache-purge, a real reverse-proxy round
      # trip, healthcheck, worker_processes, docker.sock group alignment,
      # rootless master. $IMAGE is set by the reusable workflow.
      test-command: ./tests.sh
      # The apt package is deliberately unpinned, so the version tags are read
      # back out of the image that just passed the tests: 1.12.1 and 1.12.
      version-command: docker run --rm "$IMAGE" angie -v 2>&1 | sed -n 's|.*[Aa]ngie/\([0-9][0-9.]*\).*|\1|p'
      labels: |
        org.opencontainers.image.title=angie
        org.opencontainers.image.description=Reusable Angie base — brotli + cache-purge + zstd, with Docker-socket group integration for service discovery.
        org.opencontainers.image.url=https://hub.docker.com/r/dementev/angie
        org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.vendor=Lotus Web Agency
        org.opencontainers.image.authors=Vasilii Dementev https://vasiliidementev.com
        org.opencontainers.image.licenses=MIT
    secrets: inherit

  sync-description:
    if: github.event_name != 'pull_request'
    needs: build
    uses: vdementev/docker-workflows/.github/workflows/sync-description.yml@v1
    with:
      image: angie
      short-description: "Debian-slim Angie reverse-proxy: brotli + cache-purge + zstd, latency-tuned, Docker-socket group integration."
    secrets: inherit
